name: HTML inline-JS syntax check

# Catches JS parse errors (e.g. unescaped apostrophe inside single-quoted
# string) before they land on main and silently break the live game.
#
# v2 (2026): strip HTML comments before applying the <script> regex —
# scene1_palace.html mentions the literal "<script>" inside a comment,
# which the prior extractor wrongly picked up as a code block.

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and validate inline <script> blocks
        run: |
          set +e
          fail=0
          for f in index.html certificate.html scene1_palace.html scene2_desert.html scene3_midian.html; do
            [ -f "$f" ] || { echo "skip $f (not present)"; continue; }
            python3 - "$f" <<'PY'
          import re, sys
          fname = sys.argv[1]
          html = open(fname).read()
          # Strip HTML comments first so '<script>' mentioned inside a
          # comment is not picked up as a real code block.
          html = re.sub(r'<!--.*?-->', '', html, flags=re.DOTALL)
          blocks = re.findall(r'<script(?![^>]*src)[^>]*>(.*?)</script>', html, re.DOTALL)
          open('/tmp/_check.js','w').write('\n;\n'.join(blocks))
          print(f'{len(blocks)} inline script block(s) in {fname}')
          PY
            if node --check /tmp/_check.js; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

      - name: Validate standalone JS files (service worker, etc.)
        run: |
          set +e
          fail=0
          # sw.js once shipped a JS syntax error (a 65KB comment that lost its
          # '//') which silently stopped the service worker from installing, so
          # builds kept appearing stale. node --check it directly every push.
          for f in sw.js; do
            [ -f "$f" ] || { echo "skip $f (not present)"; continue; }
            if node --check "$f"; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail
