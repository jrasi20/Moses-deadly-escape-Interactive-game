name: HTML inline-JS syntax check

# v3.28.1 Jane 2026-04-29: catches the apostrophe-inside-single-quoted-string
# class of bugs (and any other JS parse error) before it lands on main and
# silently breaks the access gate / game.

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and validate inline <script> blocks
        run: |
          set -e
          shopt -s nullglob
          fail=0
          for f in index.html scene1_palace.html scene2_desert.html scene3_midian.html; do
            [ -f "$f" ] || { echo "skip $f (not present)"; continue; }
            python3 -c "
          import re, sys
          html = open('$f').read()
          blocks = re.findall(r'<script(?![^>]*src)[^>]*>(.*?)</script>', html, re.DOTALL)
          open('/tmp/_check.js','w').write('\n'.join(blocks))
          print(f'{len(blocks)} inline script block(s) in $f')
          "
            if node --check /tmp/_check.js; then
              echo "OK  $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail
