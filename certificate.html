<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="copyright" content="copyright 2025 Bible Explorer Kids. All rights reserved.">
<title>Certificate &mdash; Moses' Deadly Escape</title>
<style>
  /* Jane 2026-06-21: the certificate is now drawn onto a CANVAS (template art +
     the kid's name / rank / score / date / seal at exact pixel positions). This
     fixes BOTH problems with the old HTML-overlay version: (1) the overlaid text
     no longer OVERLAPS the baked-in NAME/RANK/SCORE labels, and (2) the kid gets a
     clean PNG DOWNLOAD instead of a print dialog that clipped the edges. */
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 0%, #5a3410, #2a1606 70%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; padding:16px;
  }
  #certCanvas{
    width:min(96vw, 1180px); height:auto; border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,0.55); background:#f7f1df; display:block;
  }
  .bar{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .bar button{ font-family:inherit; font-weight:800; font-size:clamp(14px,4vw,17px);
    border:none; border-radius:14px; padding:13px 26px; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,0.35); }
  .dl  { background:linear-gradient(#ffe07a,#ffc23d); color:#7a3a06; }
  .back{ background:linear-gradient(#d8b878,#c19a52); color:#3a2410; }
  .hint{ color:#ffe7b8; font-size:13px; opacity:0.9; text-align:center; max-width:90vw; }
  #replayNudge{ color:#ffd976; }
</style>
</head>
<body>
  <canvas id="certCanvas" width="1344" height="768" role="img"
          aria-label="Certificate of Completion for Moses' Deadly Escape"></canvas>
  <div class="bar">
    <button class="dl"   id="dlBtn">&#11015;&nbsp; Download Certificate</button>
    <button class="back" id="menuBtn">&#127968;&nbsp; Main Menu</button>
  </div>
  <div class="hint">Tap <b>Download Certificate</b> to save it as an image you can print or share.</div>
  <div class="hint" id="replayNudge">&#11088; Want an even better score? Tap <b>Main Menu</b> and replay any level to beat your best!</div>
<script>
  function g(k, d){ try { return (localStorage.getItem(k) || '').trim() || d; } catch(e){ return d; } }
  var NAME  = g('bek.kidName', 'Brave Explorer');
  var RANK  = g('bek.certRank', 'Faithful Journey');
  var SCORE = (function(){
    var sc = g('bek.certScore', '');
    if (!sc) { var p = 0; try { p = parseInt(localStorage.getItem('bek.bundle1.totalPoints')||'0',10)||0; } catch(e){} sc = p + ' points'; }
    return sc;
  })();
  var DATES = (function(){ try { return new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); } catch(e){ return ''; } })();

  var canvas = document.getElementById('certCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  // Fit a string into a max width by shrinking the font until it fits.
  function fitFont(text, weight, startPx, maxW){
    var px = startPx;
    do { ctx.font = weight + ' ' + px + 'px "Trebuchet MS","Segoe UI",sans-serif'; px -= 1; }
    while (px > 10 && ctx.measureText(text).width > maxW);
    return px + 1;
  }

  function draw(bg){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#f7f1df'; ctx.fillRect(0,0,W,H);
    if (bg) ctx.drawImage(bg, 0, 0, W, H);

    // Values sit ON the blank underlines, which (measured from the template art)
    // begin at x=0.336W and run to x=0.763W; the printed NAME/RANK/SCORE labels
    // live to the LEFT of that. Start values just inside the line start so they
    // never touch the labels, and cap the width before the line ends / the seal.
    var x = W * 0.345;
    var maxW = W * 0.40;                 // line ends ~0.763W; gold seal starts ~0.773W
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // NAME
    ctx.fillStyle = '#7a3a06';
    var fn = fitFont(NAME, 'bold', Math.round(H*0.062), maxW);
    ctx.font = 'bold ' + fn + 'px "Trebuchet MS","Segoe UI",sans-serif';
    ctx.fillText(NAME, x, H * 0.575);

    // RANK
    ctx.fillStyle = '#4a2f12';
    var fr = fitFont(RANK, 'bold', Math.round(H*0.046), maxW);
    ctx.font = 'bold ' + fr + 'px "Trebuchet MS","Segoe UI",sans-serif';
    ctx.fillText(RANK, x, H * 0.652);

    // SCORE
    var fs = fitFont(SCORE, 'bold', Math.round(H*0.046), maxW);
    ctx.font = 'bold ' + fs + 'px "Trebuchet MS","Segoe UI",sans-serif';
    ctx.fillText(SCORE, x, H * 0.728);

    // DATE (small, under the score, on the cream — clear of the centered verse)
    if (DATES){
      ctx.fillStyle = '#7a5a30';
      ctx.font = '600 ' + Math.round(H*0.030) + 'px "Trebuchet MS","Segoe UI",sans-serif';
      ctx.fillText(DATES, x, H * 0.795);
    }

    // Gold seal, lower-right of the cream area.
    var cx = W * 0.845, cy = H * 0.66, r = W * 0.072;
    var grd = ctx.createRadialGradient(cx - r*0.3, cy - r*0.35, r*0.2, cx, cy, r);
    grd.addColorStop(0, '#ffe79a'); grd.addColorStop(0.55, '#f2b441'); grd.addColorStop(1, '#c8861f');
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-8 * Math.PI/180); ctx.translate(-cx, -cy);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fillStyle = grd; ctx.fill();
    ctx.lineWidth = r*0.06; ctx.strokeStyle = '#fff3cf'; ctx.stroke();
    ctx.fillStyle = '#6b3300'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(r*0.30) + 'px "Trebuchet MS","Segoe UI",sans-serif';
    ctx.fillText('BIBLE', cx, cy - r*0.34);
    ctx.fillText('EXPLORER', cx, cy);
    ctx.fillText('KIDS', cx, cy + r*0.34);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  // Draw once the template art is ready (real <img> so it always composites).
  var bg = new Image();
  bg.onload  = function(){ draw(bg); };
  bg.onerror = function(){ draw(null); };   // graceful: still render the text on cream
  bg.src = 'assets/images/certificate%20template.png';
  draw(null);  // immediate paint so the page is never blank while the art loads

  document.getElementById('dlBtn').addEventListener('click', function(){
    try {
      var safe = (NAME || 'certificate').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'') || 'certificate';
      var a = document.createElement('a');
      a.download = 'Moses_Certificate_' + safe + '.png';
      a.href = canvas.toDataURL('image/png');
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch(e){
      // Fallback for any browser that blocks toDataURL download: open the image.
      try { window.open(canvas.toDataURL('image/png'), '_blank'); } catch(_e){}
    }
  });

  document.getElementById('menuBtn').addEventListener('click', function(){
    window.location.href = 'scene1_palace.html';
  });
</script>
</body>
</html>
